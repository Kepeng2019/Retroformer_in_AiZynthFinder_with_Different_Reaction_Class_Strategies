[tool.poetry]
name = "aizynthfinder"
version = "3.4.0"
description = "Retrosynthetic route finding using neural network guided Monte-Carlo tree search"
authors = ["Molecular AI group <samuel.genheden@astrazeneca.com>"]
license = "MIT"
include = ["aizynthfinder/data/*.yml", "aizynthfinder/data/templates/*"]
readme = "README.md"

[tool.pytest.ini_options]
mccabe-complexity = 9


[tool.poetry.dev-dependencies]
black = "^22.0.0"
invoke = "^1.5.0"
pytest = "^6.2.2"
pytest-black = "^0.3.12"
pytest-cov = "^2.11.0"
pytest-datadir = "^1.3.1"
pytest-mock = "^3.5.0"
pytest-mccabe = "^2.0.0"
sphinx = "^4.0.0"
mypy = "^0.800"
pylint = "^2.7.0"

[tool.poetry.scripts]
aizynthcli = "aizynthfinder.interfaces.aizynthcli:main"

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
